name: Build Cobalt Downloader IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Create project files
        run: |
          mkdir -p project/Sources
          mkdir -p project/CobaltDownloader.xcodeproj

          # Create Swift source files
          cat > project/Sources/CobaltDownloaderApp.swift <<'EOF'
          import SwiftUI

          @main
          struct CobaltDownloaderApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > project/Sources/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var downloader = DownloadManager()
              @State private var urlString = ""
              @State private var downloadMode = "auto"
              @State private var apiBaseURL = "https://api.cobalt.tools"

              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("Media Link")) {
                              TextField("Paste social media link", text: $urlString)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                          }

                          Section(header: Text("Download Type")) {
                              Picker("Type", selection: $downloadMode) {
                                  Text("Auto").tag("auto")
                                  Text("Audio").tag("audio")
                                  Text("Mute (no audio)").tag("mute")
                              }
                              .pickerStyle(SegmentedPickerStyle())
                          }

                          Section(header: Text("API Server")) {
                              TextField("API Base URL", text: $apiBaseURL)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                              Text("Default is Cobalt public API. You can self-host for better reliability.")
                                  .font(.footnote)
                                  .foregroundColor(.secondary)
                          }

                          Section {
                              Button(action: {
                                  Task {
                                      await downloader.download(
                                          urlString: urlString,
                                          mode: downloadMode,
                                          apiBaseURL: apiBaseURL
                                      )
                                  }
                              }) {
                                  if downloader.progress > 0 && downloader.progress < 1 {
                                      ProgressView(value: downloader.progress)
                                          .frame(maxWidth: .infinity)
                                  } else {
                                      Text("Download")
                                          .frame(maxWidth: .infinity)
                                  }
                              }
                              .disabled(urlString.isEmpty || downloader.isDownloading)
                          }

                          if let downloadedURL = downloader.downloadedURL {
                              Section(header: Text("Downloaded File")) {
                                  Text(downloadedURL.lastPathComponent)
                                      .font(.subheadline)
                                  ShareLink(item: downloadedURL) {
                                      Label("Save to Files / Share", systemImage: "square.and.arrow.up")
                                  }
                              }
                          }
                      }
                      .navigationTitle("Cobalt Downloader")
                      .alert("Error", isPresented: $downloader.showError) {
                          Button("OK", role: .cancel) { }
                      } message: {
                          Text(downloader.errorMessage)
                      }
                  }
              }
          }
          EOF

          cat > project/Sources/DownloadManager.swift <<'EOF'
          import Foundation
          import Combine

          struct CobaltResponse: Codable {
              let status: String?
              let url: String?
              let filename: String?
              let error: String?
          }

          @MainActor
          final class DownloadManager: NSObject, ObservableObject, URLSessionDownloadDelegate {
              @Published var progress: Double = 0
              @Published var isDownloading = false
              @Published var downloadedURL: URL?
              @Published var showError = false
              @Published var errorMessage = ""

              private var downloadContinuation: CheckedContinuation<URL, Error>?
              private var downloadTask: URLSessionDownloadTask?
              private var expectedFilename: String = ""

              func download(urlString: String, mode: String, apiBaseURL: String) async {
                  guard let mediaURL = await fetchMediaURL(urlString: urlString, mode: mode, apiBaseURL: apiBaseURL) else {
                      return
                  }

                  isDownloading = true
                  progress = 0
                  downloadedURL = nil
                  errorMessage = ""

                  let session = URLSession(configuration: .default, delegate: self, delegateQueue: nil)
                  let task = session.downloadTask(with: mediaURL)
                  downloadTask = task
                  task.resume()

                  do {
                      let tempURL = try await withCheckedThrowingContinuation { continuation in
                          downloadContinuation = continuation
                      }

                      let fileManager = FileManager.default
                      let documents = fileManager.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      let downloadsDir = documents.appendingPathComponent("Downloads", isDirectory: true)
                      try fileManager.createDirectory(at: downloadsDir, withIntermediateDirectories: true)

                      var filename = expectedFilename
                      if filename.isEmpty {
                          filename = mediaURL.lastPathComponent
                      }
                      let destination = downloadsDir.appendingPathComponent(filename)
                      if fileManager.fileExists(atPath: destination.path) {
                          try fileManager.removeItem(at: destination)
                      }
                      try fileManager.moveItem(at: tempURL, to: destination)

                      downloadedURL = destination
                      progress = 1.0
                  } catch {
                      errorMessage = "Download failed: \(error.localizedDescription)"
                      showError = true
                  }

                  isDownloading = false
                  downloadContinuation = nil
                  downloadTask = nil
              }

              private func fetchMediaURL(urlString: String, mode: String, apiBaseURL: String) async -> URL? {
                  guard let url = URL(string: "\(apiBaseURL)/api/json") else {
                      errorMessage = "Invalid API URL"
                      showError = true
                      return nil
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("application/json", forHTTPHeaderField: "Accept")

                  let body: [String: String] = [
                      "url": urlString,
                      "downloadMode": mode
                  ]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  do {
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let httpResponse = response as? HTTPURLResponse,
                            (200...299).contains(httpResponse.statusCode) else {
                          errorMessage = "API error: \(response)"
                          showError = true
                          return nil
                      }
                      let decoded = try JSONDecoder().decode(CobaltResponse.self, from: data)
                      if decoded.status == "error" || decoded.status == "failed" {
                          errorMessage = decoded.error ?? "Unknown API error"
                          showError = true
                          return nil
                      }
                      guard let mediaURLString = decoded.url,
                            let mediaURL = URL(string: mediaURLString) else {
                          errorMessage = "No media URL returned"
                          showError = true
                          return nil
                      }
                      expectedFilename = decoded.filename ?? ""
                      return mediaURL
                  } catch {
                      errorMessage = "API request failed: \(error.localizedDescription)"
                      showError = true
                      return nil
                  }
              }

              // MARK: - URLSessionDownloadDelegate

              nonisolated func urlSession(
                  _ session: URLSession,
                  downloadTask: URLSessionDownloadTask,
                  didWriteData bytesWritten: Int64,
                  totalBytesWritten: Int64,
                  totalBytesExpectedToWrite: Int64
              ) {
                  let progress = totalBytesExpectedToWrite > 0
                      ? Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                      : 0
                  Task { @MainActor in
                      self.progress = progress
                  }
              }

              nonisolated func urlSession(
                  _ session: URLSession,
                  downloadTask: URLSessionDownloadTask,
                  didFinishDownloadingTo location: URL
              ) {
                  Task { @MainActor in
                      self.downloadContinuation?.resume(returning: location)
                      self.downloadContinuation = nil
                  }
              }

              nonisolated func urlSession(
                  _ session: URLSession,
                  task: URLSessionTask,
                  didCompleteWithError error: Error?
              ) {
                  if let error = error {
                      Task { @MainActor in
                          self.downloadContinuation?.resume(throwing: error)
                          self.downloadContinuation = nil
                      }
                  }
              }
          }
