name: Build Cobalt Downloader IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Create project files
        run: |
          mkdir -p project/Sources
          mkdir -p project/CobaltDownloader.xcodeproj

          cat > project/Sources/CobaltDownloaderApp.swift <<'EOF'
          import SwiftUI

          @main
          struct CobaltDownloaderApp: App {
              var body: some Scene {
                  WindowGroup {
                      MainTabView()
                  }
              }
          }
          EOF

          cat > project/Sources/MainTabView.swift <<'EOF'
          import SwiftUI

          struct MainTabView: View {
              var body: some View {
                  TabView {
                      DownloaderView()
                          .tabItem {
                              Label("Download", systemImage: "arrow.down.circle.fill")
                          }
                      DownloadsView()
                          .tabItem {
                              Label("Files", systemImage: "folder.fill")
                          }
                  }
              }
          }
          EOF

          cat > project/Sources/DownloaderView.swift <<'EOF'
          import SwiftUI

          struct DownloaderView: View {
              @StateObject private var downloader = DownloadManager()
              @StateObject private var endpointManager = EndpointManager()
              @State private var urlString = ""
              @State private var downloadMode = "auto"
              @State private var showEndpointManager = false

              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("Media Link")) {
                              TextField("Paste social media link", text: $urlString)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                          }

                          Section(header: Text("Download Type")) {
                              Picker("Type", selection: $downloadMode) {
                                  Text("Auto").tag("auto")
                                  Text("Audio").tag("audio")
                                  Text("Mute").tag("mute")
                              }
                              .pickerStyle(SegmentedPickerStyle())
                          }

                          Section(header: Text("API Server")) {
                              Toggle("Auto-try all endpoints", isOn: $endpointManager.autoTryAll)
                              if !endpointManager.autoTryAll {
                                  Picker("Endpoint", selection: $endpointManager.selectedEndpointID) {
                                      ForEach(endpointManager.endpoints) { endpoint in
                                          Text(endpoint.name).tag(endpoint.id)
                                      }
                                  }
                                  .pickerStyle(MenuPickerStyle())
                              } else {
                                  Text("App will try each saved endpoint in order.")
                                      .font(.footnote)
                                      .foregroundColor(.secondary)
                              }
                              Button("Manage API Endpoints") {
                                  showEndpointManager = true
                              }
                          }

                          Section {
                              Button(action: {
                                  Task {
                                      await downloader.download(
                                          urlString: urlString,
                                          mode: downloadMode,
                                          endpoints: endpointManager.getEndpointsToTry()
                                      )
                                  }
                              }) {
                                  if downloader.progress > 0 && downloader.progress < 1 {
                                      ProgressView(value: downloader.progress)
                                          .frame(maxWidth: .infinity)
                                  } else {
                                      Text("Download")
                                          .frame(maxWidth: .infinity)
                                  }
                              }
                              .disabled(urlString.isEmpty || downloader.isDownloading)
                          }

                          if let downloadedURL = downloader.downloadedURL {
                              Section(header: Text("Downloaded File")) {
                                  Text(downloadedURL.lastPathComponent)
                                      .font(.subheadline)
                                  ShareLink(item: downloadedURL) {
                                      Label("Save to Files / Share", systemImage: "square.and.arrow.up")
                                  }
                              }
                          }
                      }
                      .navigationTitle("Cobalt Downloader")
                      .alert("Error", isPresented: $downloader.showError) {
                          Button("OK", role: .cancel) { }
                      } message: {
                          Text(downloader.errorMessage)
                      }
                      .sheet(isPresented: $showEndpointManager) {
                          EndpointManagerView()
                              .environmentObject(endpointManager)
                      }
                  }
              }
          }
          EOF

          cat > project/Sources/DownloadsView.swift <<'EOF'
          import SwiftUI

          struct DownloadsView: View {
              @State private var files: [URL] = []
              private let downloadsDir: URL = {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  return docs.appendingPathComponent("Downloads", isDirectory: true)
              }()

              var body: some View {
                  NavigationView {
                      List {
                          if files.isEmpty {
                              Text("No downloaded files yet")
                                  .foregroundColor(.secondary)
                          } else {
                              ForEach(files, id: \.self) { file in
                                  HStack {
                                      VStack(alignment: .leading) {
                                          Text(file.lastPathComponent)
                                              .font(.subheadline)
                                          Text(file.fileSizeString)
                                              .font(.caption)
                                              .foregroundColor(.secondary)
                                      }
                                      Spacer()
                                      ShareLink(item: file) {
                                          Image(systemName: "square.and.arrow.up")
                                      }
                                      Button(role: .destructive) {
                                          try? FileManager.default.removeItem(at: file)
                                          loadFiles()
                                      } label: {
                                          Image(systemName: "trash")
                                              .foregroundColor(.red)
                                      }
                                  }
                              }
                          }
                      }
                      .navigationTitle("Downloads")
                      .onAppear(perform: loadFiles)
                  }
              }

              private func loadFiles() {
                  do {
                      try FileManager.default.createDirectory(at: downloadsDir, withIntermediateDirectories: true)
                      files = try FileManager.default.contentsOfDirectory(at: downloadsDir, includingPropertiesForKeys: nil)
                          .filter { $0.pathExtension != "" }
                  } catch {
                      files = []
                  }
              }
          }

          extension URL {
              var fileSizeString: String {
                  let size = (try? resourceValues(forKeys: [.fileSizeKey]))?.fileSize ?? 0
                  let formatter = ByteCountFormatter()
                  formatter.countStyle = .file
                  return formatter.string(fromByteCount: Int64(size))
              }
          }
          EOF

          cat > project/Sources/EndpointManager.swift <<'EOF'
          import Foundation
          import SwiftUI

          struct APIEndpoint: Identifiable, Codable, Equatable {
              var id: UUID = UUID()
              var name: String
              var url: String
          }

          final class EndpointManager: ObservableObject {
              @Published var endpoints: [APIEndpoint] = [] {
                  didSet { saveEndpoints() }
              }
              @Published var selectedEndpointID: UUID? {
                  didSet { saveSelected() }
              }
              @Published var autoTryAll: Bool = false {
                  didSet { saveAutoTryAll() }
              }

              private let endpointsKey = "apiEndpoints"
              private let selectedKey = "selectedEndpointID"
              private let autoTryKey = "autoTryAll"

              init() {
                  load()
                  if endpoints.isEmpty {
                      // Built-in defaults – you can add more
                      endpoints = [
                          APIEndpoint(name: "Cobalt Official", url: "https://api.cobalt.tools"),
                          APIEndpoint(name: "Cobalt Public 2", url: "https://co.wuk.sh"),
                          APIEndpoint(name: "Cobalt Public 3", url: "https://cobalt-api.kwiatekmiki.com"),
                          APIEndpoint(name: "Cobalt Public 4", url: "https://cobalt-api.vercel.app")
                      ]
                  }
                  if selectedEndpointID == nil || !endpoints.contains(where: { $0.id == selectedEndpointID }) {
                      selectedEndpointID = endpoints.first?.id
                  }
              }

              func getEndpointsToTry() -> [APIEndpoint] {
                  if autoTryAll {
                      return endpoints
                  } else {
                      if let selected = endpoints.first(where: { $0.id == selectedEndpointID }) {
                          return [selected]
                      }
                      return []
                  }
              }

              func addEndpoint(name: String, url: String) {
                  let endpoint = APIEndpoint(name: name, url: url)
                  endpoints.append(endpoint)
                  if selectedEndpointID == nil {
                      selectedEndpointID = endpoint.id
                  }
              }

              func deleteEndpoint(_ endpoint: APIEndpoint) {
                  endpoints.removeAll { $0.id == endpoint.id }
                  if selectedEndpointID == endpoint.id {
                      selectedEndpointID = endpoints.first?.id
                  }
              }

              private func saveEndpoints() {
                  if let data = try? JSONEncoder().encode(endpoints) {
                      UserDefaults.standard.set(data, forKey: endpointsKey)
                  }
              }

              private func saveSelected() {
                  if let id = selectedEndpointID {
                      UserDefaults.standard.set(id.uuidString, forKey: selectedKey)
                  }
              }

              private func saveAutoTryAll() {
                  UserDefaults.standard.set(autoTryAll, forKey: autoTryKey)
              }

              private func load() {
                  if let data = UserDefaults.standard.data(forKey: endpointsKey),
                     let decoded = try? JSONDecoder().decode([APIEndpoint].self, from: data) {
                      endpoints = decoded
                  }
                  if let idString = UserDefaults.standard.string(forKey: selectedKey),
                     let uuid = UUID(uuidString: idString) {
                      selectedEndpointID = uuid
                  }
                  autoTryAll = UserDefaults.standard.bool(forKey: autoTryKey)
              }
          }
          EOF

          cat > project/Sources/EndpointManagerView.swift <<'EOF'
          import SwiftUI

          struct EndpointManagerView: View {
              @EnvironmentObject var endpointManager: EndpointManager
              @Environment(\.dismiss) private var dismiss
              @State private var newName = ""
              @State private var newURL = ""

              var body: some View {
                  NavigationView {
                      List {
                          Section(header: Text("Saved Endpoints")) {
                              ForEach(endpointManager.endpoints) { endpoint in
                                  HStack {
                                      VStack(alignment: .leading) {
                                          Text(endpoint.name)
                                              .font(.headline)
                                          Text(endpoint.url)
                                              .font(.caption)
                                              .foregroundColor(.secondary)
                                      }
                                      Spacer()
                                      if endpoint.id == endpointManager.selectedEndpointID {
                                          Image(systemName: "checkmark.circle.fill")
                                              .foregroundColor(.blue)
                                      }
                                  }
                                  .contentShape(Rectangle())
                                  .onTapGesture {
                                      endpointManager.selectedEndpointID = endpoint.id
                                  }
                                  .swipeActions {
                                      Button(role: .destructive) {
                                          endpointManager.deleteEndpoint(endpoint)
                                      } label: {
                                          Label("Delete", systemImage: "trash")
                                      }
                                  }
                              }
                          }

                          Section(header: Text("Add New Endpoint")) {
                              TextField("Name", text: $newName)
                              TextField("URL (e.g., https://my-server.com)", text: $newURL)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                              Button("Add Endpoint") {
                                  let name = newName.trimmingCharacters(in: .whitespaces)
                                  let url = newURL.trimmingCharacters(in: .whitespaces)
                                  if !name.isEmpty && !url.isEmpty {
                                      endpointManager.addEndpoint(name: name, url: url)
                                      newName = ""
                                      newURL = ""
                                  }
                              }
                              .disabled(newName.isEmpty || newURL.isEmpty)
                          }
                      }
                      .navigationTitle("API Endpoints")
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
              }
          }
          EOF

          cat > project/Sources/DownloadManager.swift <<'EOF'
          import Foundation
          import Combine

          struct CobaltResponse: Codable {
              let status: String?
              let url: String?
              let filename: String?
              let error: String?
          }

          @MainActor
          final class DownloadManager: NSObject, ObservableObject, URLSessionDownloadDelegate {
              @Published var progress: Double = 0
              @Published var isDownloading = false
              @Published var downloadedURL: URL?
              @Published var showError = false
              @Published var errorMessage = ""

              private var downloadContinuation: CheckedContinuation<URL, Error>?
              private var downloadTask: URLSessionDownloadTask?
              private var expectedFilename: String = ""

              func download(urlString: String, mode: String, endpoints: [APIEndpoint]) async {
                  guard !endpoints.isEmpty else {
                      errorMessage = "No API endpoints configured"
                      showError = true
                      return
                  }

                  isDownloading = true
                  progress = 0
                  downloadedURL = nil
                  errorMessage = ""

                  var lastError = "All endpoints failed"

                  for endpoint in endpoints {
                      do {
                          let mediaURL = try await fetchMediaURL(
                              urlString: urlString,
                              mode: mode,
                              apiBaseURL: endpoint.url
                          )
                          // Download the file
                          let session = URLSession(configuration: .default, delegate: self, delegateQueue: nil)
                          let task = session.downloadTask(with: mediaURL)
                          downloadTask = task
                          task.resume()

                          let tempURL = try await withCheckedThrowingContinuation { continuation in
                              downloadContinuation = continuation
                          }

                          let fileManager = FileManager.default
                          let documents = fileManager.urls(for: .documentDirectory, in: .userDomainMask)[0]
                          let downloadsDir = documents.appendingPathComponent("Downloads", isDirectory: true)
                          try fileManager.createDirectory(at: downloadsDir, withIntermediateDirectories: true)

                          var filename = expectedFilename
                          if filename.isEmpty {
                              filename = mediaURL.lastPathComponent
                          }
                          let destination = downloadsDir.appendingPathComponent(filename)
                          if fileManager.fileExists(atPath: destination.path) {
                              try fileManager.removeItem(at: destination)
                          }
                          try fileManager.moveItem(at: tempURL, to: destination)

                          downloadedURL = destination
                          progress = 1.0
                          isDownloading = false
                          return
                      } catch {
                          lastError = "\(endpoint.name): \(error.localizedDescription)"
                          progress = 0
                      }
                  }

                  errorMessage = lastError
                  showError = true
                  isDownloading = false
              }

              private func fetchMediaURL(urlString: String, mode: String, apiBaseURL: String) async throws -> URL {
                  guard let url = URL(string: "\(apiBaseURL)/api/json") else {
                      throw NSError(domain: "Invalid API URL", code: 0)
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("application/json", forHTTPHeaderField: "Accept")

                  let body: [String: String] = [
                      "url": urlString,
                      "downloadMode": mode
                  ]
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let httpResponse = response as? HTTPURLResponse,
                        (200...299).contains(httpResponse.statusCode) else {
                      throw NSError(domain: "API error: \(response)", code: 1)
                  }
                  let decoded = try JSONDecoder().decode(CobaltResponse.self, from: data)
                  if decoded.status == "error" || decoded.status == "failed" {
                      throw NSError(domain: decoded.error ?? "Unknown API error", code: 2)
                  }
                  guard let mediaURLString = decoded.url,
                        let mediaURL = URL(string: mediaURLString) else {
                      throw NSError(domain: "No media URL returned", code: 3)
                  }
                  expectedFilename = decoded.filename ?? ""
                  return mediaURL
              }

              // MARK: - URLSessionDownloadDelegate

              nonisolated func urlSession(
                  _ session: URLSession,
                  downloadTask: URLSessionDownloadTask,
                  didWriteData bytesWritten: Int64,
                  totalBytesWritten: Int64,
                  totalBytesExpectedToWrite: Int64
              ) {
                  let progress = totalBytesExpectedToWrite > 0
                      ? Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                      : 0
                  Task { @MainActor in
                      self.progress = progress
                  }
              }

              nonisolated func urlSession(
                  _ session: URLSession,
                  downloadTask: URLSessionDownloadTask,
                  didFinishDownloadingTo location: URL
              ) {
                  Task { @MainActor in
                      self.downloadContinuation?.resume(returning: location)
                      self.downloadContinuation = nil
                  }
              }

              nonisolated func urlSession(
                  _ session: URLSession,
                  task: URLSessionTask,
                  didCompleteWithError error: Error?
              ) {
                  if let error = error {
                      Task { @MainActor in
                          self.downloadContinuation?.resume(throwing: error)
                          self.downloadContinuation = nil
                      }
                  }
              }
          }
