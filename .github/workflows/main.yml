      - name: Build unsigned IPA
        working-directory: project
        run: |
          xcodebuild \
            -project CobaltDownloader.xcodeproj \
            -scheme CobaltDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr CobaltDownloader-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CobaltDownloader-unsigned-ipa
          path: project/CobaltDownloader-unsigned.ipa
